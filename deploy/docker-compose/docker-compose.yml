name: rockbot

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "15672:15672"   # Management UI (optional, handy for debugging)
      - "5672:5672"     # AMQP — lets `rockbot chat` run on the host against this stack
    environment:
      RABBITMQ_DEFAULT_USER: rockbot
      RABBITMQ_DEFAULT_PASS: rockbot
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-init:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.agent
    image: rockylhotka/rockbot-agent:latest
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Seeding agent data volume..."
        # Profile and dream directives — live at /app/agent/*.md in the image.
        # Copy every .md file no-clobber so operators can tune any directive
        # (including dream passes) without a rebuild, and new directives added in
        # future releases get seeded automatically. Matches the Helm chart's
        # init-agent-data container; a hardcoded list here went stale and silently
        # dropped 13 files, including safety-rules.md (the prompt-injection guardrail).
        for src in /app/agent/*.md; do
          [ -f "$$src" ] || continue
          f=$$(basename "$$src")
          dst="/data/agent/$$f"
          if [ ! -s "$$dst" ]; then
            echo "  Copying $$f"
            cp "$$src" "$$dst"
          fi
        done
        if [ -f /app/agent/well-known-agents.json ] && [ ! -s /data/agent/well-known-agents.json ]; then
          cp /app/agent/well-known-agents.json /data/agent/well-known-agents.json
        fi
        # Seed mcp.json with compose-local MCP server URLs
        # (overrides the image default which references cluster-internal URLs)
        if [ ! -f /data/agent/mcp.json ]; then
          cat > /data/agent/mcp.json <<'MCPEOF'
        {"mcpServers":{"introspection":{"type":"sse","url":"http://introspection-mcp:8080/"}}}
        MCPEOF
        fi
        # Per-model behavior files
        for model_dir in /app/model-behaviors/*/; do
          [ -d "$$model_dir" ] || continue
          model_name=$$(basename "$$model_dir")
          mkdir -p "/data/agent/model-behaviors/$$model_name"
          for src in "$$model_dir"*; do
            [ -f "$$src" ] || continue
            dst="/data/agent/model-behaviors/$$model_name/$$(basename $$src)"
            if [ ! -s "$$dst" ]; then
              cp "$$src" "$$dst"
            fi
          done
        done
        mkdir -p /data/agent/memory /data/agent/skills /data/agent/conversations /data/agent/feedback
        # The shared volume (attachments, script file exchange) is also root-owned;
        # the non-root agent creates /rockbot/shared/attachments on startup, so pre-make
        # it and open permissions here.
        mkdir -p /rockbot/shared/attachments
        # Docker volumes are owned by root, so the non-root agent user needs access
        chmod -R 777 /data/agent /rockbot/shared
        echo "Agent data volume ready."
    volumes:
      - ${AGENT_DATA_PATH:-agent-data}:/data/agent
      - shared:/rockbot/shared

  agent:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.agent
    image: rockylhotka/rockbot-agent:latest
    depends_on:
      agent-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      introspection-mcp:
        condition: service_started
    environment:
      # -- RabbitMQ --
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: rockbot
      RabbitMq__Password: rockbot
      RabbitMq__VirtualHost: /
      # -- LLM provider --
      # Set LLM_PROVIDER=Copilot and GITHUB_TOKEN in .env for Copilot SDK,
      # or leave LLM_PROVIDER unset and configure LLM_ENDPOINT/LLM_API_KEY for OpenAI-compatible.
      LLM__Provider: ${LLM_PROVIDER:-}
      # Copilot path — GITHUB_TOKEN is read by the Copilot CLI subprocess
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # GitHub MCP server — mcp.json's github entry sends this as its bearer header.
      # Set up with deploy/github/setup.sh (a fine-grained, read-only PAT; separate from GITHUB_TOKEN).
      GITHUB_MCP_TOKEN: ${GITHUB_MCP_TOKEN:-}
      # Per-tier model IDs (LLM_MODEL_ID sets Balanced; High falls back to Balanced when unset).
      # Low defaults to a cheap model rather than falling back to Balanced — Low carries the
      # highest-volume, lowest-complexity traffic (patrol subagents, the Dream cycle), so an
      # unconfigured Low tier silently bills all of that at Balanced's price.
      LLM__Balanced__ModelId: ${LLM_MODEL_ID:-anthropic/claude-haiku-5.5}
      LLM__Low__ModelId: ${LLM_LOW_MODEL_ID:-anthropic/claude-haiku-5.5}
      LLM__High__ModelId: ${LLM_HIGH_MODEL_ID:-}
      # OpenAI-compatible path (ignored when Provider=Copilot)
      LLM__Balanced__Endpoint: ${LLM_ENDPOINT:-}
      LLM__Balanced__ApiKey: ${LLM_API_KEY:-}
      # A tier with only a ModelId doesn't inherit Balanced's endpoint/key, so setting
      # LLM_LOW/HIGH_MODEL_ID alone would crash the agent at startup. With no ModelId a
      # tier still falls back to Balanced, so these are harmless when unset.
      LLM__Low__Endpoint: ${LLM_ENDPOINT:-}
      LLM__Low__ApiKey: ${LLM_API_KEY:-}
      LLM__High__Endpoint: ${LLM_ENDPOINT:-}
      LLM__High__ApiKey: ${LLM_API_KEY:-}
      # -- Web search --
      WebTools__ApiKey: ${BRAVE_API_KEY:-}
      # -- Embedding (optional — enables hybrid vector search) --
      # When set, memory/skills/working memory use cosine similarity alongside BM25.
      # Falls back to BM25-only when not configured — no functionality is lost.
      # Embedding__Endpoint: ${EMBEDDING_ENDPOINT:-}
      # Embedding__Model: ${EMBEDDING_MODEL:-}
      # Embedding__ApiKey: ${EMBEDDING_API_KEY:-}
      # -- Agent data paths --
      AgentProfile__BasePath: /data/agent
      Memory__BasePath: /data/agent/memory
      Skill__BasePath: /data/agent/skills
      McpBridge__ConfigPath: /data/agent/mcp.json
      ModelBehaviors__BasePath: /data/agent/model-behaviors
      # -- Timezone (set to your IANA timezone) --
      Agent__Timezone: ${AGENT_TIMEZONE:-America/Chicago}
    # Optional escape hatch for raw .NET config keys that have no dedicated variable
    # above (e.g. ModelBehaviors__Models__<prefix>__UseTextBasedToolCalling for a model
    # without native tool calling). Absent by default — nothing changes if the file
    # does not exist. Values in `environment:` above still win over this file.
    env_file:
      - path: ./agent.extra.env
        required: false
    volumes:
      - ${AGENT_DATA_PATH:-agent-data}:/data/agent
      - shared:/rockbot/shared

  scripts-init:
    image: docker:cli
    entrypoint: ["docker", "image", "pull", "python:3.12-slim"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  scripts-manager:
    build:
      context: ../..
      dockerfile: Dockerfile.scripts-manager
    image: rockylhotka/rockbot-scripts-manager:latest
    user: root   # Required for Docker socket access
    depends_on:
      scripts-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: rockbot
      RabbitMq__Password: rockbot
      RabbitMq__VirtualHost: /
      Scripts__Provider: Docker
      Scripts__Docker__Image: python:3.12-slim
      Scripts__Docker__CpuLimit: "500m"
      Scripts__Docker__MemoryLimit: 256Mi
      Scripts__Docker__NetworkMode: bridge
      Scripts__Docker__SharedVolumeName: rockbot_shared
      Scripts__Docker__SharedVolumePath: /rockbot/shared
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  introspection-mcp:
    build:
      context: ../..
      dockerfile: src/McpServer.Introspection/Dockerfile
    image: rockylhotka/rockbot-introspection-mcp:latest
    depends_on:
      agent-init:
        condition: service_completed_successfully
    environment:
      AgentName__Path: /data/agent/agent-name.md
    volumes:
      - ${AGENT_DATA_PATH:-agent-data}:/data/agent

  # Microsoft Graph tools for one mailbox: mail (read), calendar and contacts (read/write)
  # (opt-in: COMPOSE_PROFILES=graph). Set up with deploy/graph/setup.sh. Only this container
  # holds the client secret.
  graph-mcp:
    profiles: ["graph"]
    build:
      context: ../..
      dockerfile: src/McpServer.Graph/Dockerfile
    image: rockylhotka/rockbot-graph-mcp:latest
    restart: unless-stopped
    environment:
      Graph__TenantId: ${GRAPH_TENANT_ID:-}
      Graph__ClientId: ${GRAPH_CLIENT_ID:-}
      Graph__ClientSecret: ${GRAPH_CLIENT_SECRET:-}
      Graph__Mailbox: ${GRAPH_MAILBOX:-}
      Graph__TimeZone: ${AGENT_TIMEZONE:-America/Chicago}
      # OneDrive/SharePoint drives, up to 5 (opt-in: deploy/graph/06-scope-drive.sh). An unused
      # slot binds as an empty alias and McpServer.Graph drops it at startup; which aliases are
      # read-only, read-write or unreachable is decided by the argGuards 07-enable-drives.sh adds
      # to the agent's mcp.json, not by anything here.
      Graph__Drives__0__Alias: ${GRAPH_DRIVE_0_ALIAS:-}
      Graph__Drives__0__SiteId: ${GRAPH_DRIVE_0_SITE_ID:-}
      Graph__Drives__1__Alias: ${GRAPH_DRIVE_1_ALIAS:-}
      Graph__Drives__1__SiteId: ${GRAPH_DRIVE_1_SITE_ID:-}
      Graph__Drives__2__Alias: ${GRAPH_DRIVE_2_ALIAS:-}
      Graph__Drives__2__SiteId: ${GRAPH_DRIVE_2_SITE_ID:-}
      Graph__Drives__3__Alias: ${GRAPH_DRIVE_3_ALIAS:-}
      Graph__Drives__3__SiteId: ${GRAPH_DRIVE_3_SITE_ID:-}
      Graph__Drives__4__Alias: ${GRAPH_DRIVE_4_ALIAS:-}
      Graph__Drives__4__SiteId: ${GRAPH_DRIVE_4_SITE_ID:-}

  # Trello boards, lists and cards: read, create, update, move and comment; no archive or delete
  # (opt-in: COMPOSE_PROFILES=trello). Set up with deploy/trello/setup.sh. Only this container
  # holds the Trello key and token.
  trello-mcp:
    profiles: ["trello"]
    build:
      context: ../..
      dockerfile: src/McpServer.Trello/Dockerfile
    image: rockylhotka/rockbot-trello-mcp:latest
    restart: unless-stopped
    environment:
      Trello__ApiKey: ${TRELLO_API_KEY:-}
      Trello__Token: ${TRELLO_TOKEN:-}
      Trello__AllowedBoardIds: ${TRELLO_ALLOWED_BOARD_IDS:-}

  # Gmail, read + search + drafts (never send), across several accounts (opt-in:
  # COMPOSE_PROFILES=gmail). Set up with deploy/gmail/setup.sh --account NAME, once per account.
  # The per-account settings are in the generated gmail.env, which points at the
  # GMAIL_<NAME>_REFRESH_TOKEN values in .env.
  gmail-mcp:
    profiles: ["gmail"]
    build:
      context: ../..
      dockerfile: src/McpServer.Gmail/Dockerfile
    image: rockylhotka/rockbot-gmail-mcp:latest
    restart: unless-stopped
    env_file:
      - path: gmail.env
        required: false
    environment:
      Gmail__ClientId: ${GMAIL_CLIENT_ID:-}
      Gmail__ClientSecret: ${GMAIL_CLIENT_SECRET:-}
      Gmail__TimeZone: ${AGENT_TIMEZONE:-America/Chicago}

  # Slack, read and search only, across several workspaces (opt-in: COMPOSE_PROFILES=slack). Set up
  # with deploy/slack/setup.sh --workspace NAME, once per workspace. The per-workspace settings are
  # in the generated slack.env, which points at the SLACK_<NAME>_TOKEN values in .env.
  slack-mcp:
    profiles: ["slack"]
    build:
      context: ../..
      dockerfile: src/McpServer.Slack/Dockerfile
    image: rockylhotka/rockbot-slack-mcp:latest
    restart: unless-stopped
    env_file:
      - path: slack.env
        required: false
    environment:
      Slack__TimeZone: ${AGENT_TIMEZONE:-America/Chicago}

  # Obsidian vault (opt-in: COMPOSE_PROFILES=obsidian). Set up with deploy/obsidian/setup.sh.
  # obsidian-sync runs Obsidian's headless Sync client, keeping the obsidian-vault volume in two-way
  # sync with one remote vault; only it holds the Obsidian login. obsidian-mcp gives the agent
  # search/read over the whole vault and create/append only under OBSIDIAN_WRITE_FOLDER.
  # Both run as uid 1000 so either can write the notes the other created.
  obsidian-sync:
    profiles: ["obsidian"]
    build:
      context: ../obsidian
      dockerfile: Dockerfile.sync
    image: rockbot-obsidian-sync:latest
    restart: unless-stopped
    volumes:
      - obsidian-vault:/vault
      - obsidian-config:/config

  obsidian-mcp:
    profiles: ["obsidian"]
    build:
      context: ../..
      dockerfile: src/McpServer.Obsidian/Dockerfile
    image: rockylhotka/rockbot-obsidian-mcp:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - obsidian-sync   # creates /vault with the right owner on first start
    environment:
      Obsidian__VaultPath: /vault
      Obsidian__WriteFolder: ${OBSIDIAN_WRITE_FOLDER:-RockBot}
      Obsidian__VaultName: ${OBSIDIAN_VAULT_NAME:-}
      Obsidian__TimeZone: ${AGENT_TIMEZONE:-America/Chicago}
    volumes:
      - obsidian-vault:/vault

  # Advisor council and its research helper (opt-in: COMPOSE_PROFILES=council). Each answers one
  # A2A task and exits, as in Kubernetes where KEDA starts a pod per task; here `restart: always`
  # brings it straight back. Their queues are durable, so a task sent mid-restart waits for it.
  # Both use the agent's OpenAI-compatible LLM settings (not the Copilot provider).
  advisor-council:
    profiles: ["council"]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.advisor-council
    image: rockylhotka/rockbot-advisor-council:latest
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment: &council-env
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: rockbot
      RabbitMq__Password: rockbot
      RabbitMq__VirtualHost: /
      LLM__Balanced__Endpoint: ${LLM_ENDPOINT:-}
      LLM__Balanced__ApiKey: ${LLM_API_KEY:-}
      LLM__Balanced__ModelId: ${LLM_MODEL_ID:-anthropic/claude-haiku-5.5}
      # The High tier (the council's synthesis) needs its own endpoint and key; it does not
      # inherit Balanced's. Falls back to the Balanced model when LLM_HIGH_MODEL_ID is unset.
      LLM__High__Endpoint: ${LLM_ENDPOINT:-}
      LLM__High__ApiKey: ${LLM_API_KEY:-}
      LLM__High__ModelId: ${LLM_HIGH_MODEL_ID:-${LLM_MODEL_ID:-anthropic/claude-haiku-5.5}}
      Agent__Timezone: ${AGENT_TIMEZONE:-America/Chicago}

  research-agent:
    profiles: ["council"]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.research-agent
    image: rockylhotka/rockbot-research-agent:latest
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *council-env
      WebTools__ApiKey: ${BRAVE_API_KEY:-}

  blazor-init:
    image: busybox:latest
    user: root
    command: ["/bin/sh", "-c", "mkdir -p /data/blazor/keys && chmod -R 777 /data/blazor"]
    volumes:
      - blazor-data:/data/blazor

  blazor:
    build:
      context: ../..
      dockerfile: src/RockBot.UserProxy.Blazor/Dockerfile
    image: rockylhotka/rockbot-blazor:latest
    depends_on:
      blazor-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      # Loopback only by default: other machines should come in through the caddy service (HTTPS +
      # sign-in, see deploy/https). Set BLAZOR_BIND=0.0.0.0 to expose plain http on the LAN instead.
      - "${BLAZOR_BIND:-127.0.0.1}:8080:8080"
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: rockbot
      RabbitMq__Password: rockbot
      RabbitMq__VirtualHost: /
      # Persistent ASP.NET Core data-protection key ring — without it the ring is
      # regenerated on every restart and antiforgery tokens minted before the restart
      # are rejected. The app fails fast if this path is not writable, which is what
      # blazor-init above exists to guarantee: Docker named volumes are root-owned and
      # the image runs as a non-root user. Kubernetes gets this free from fsGroup.
      DataProtection__KeyRingPath: /data/blazor/keys
      # -- OAuth sign-in (optional) --
      # Off unless BLAZOR_AUTH_ENABLED=true in .env. Providers: Google and Microsoft (Entra ID).
      # Microsoft sign-in over HTTPS on the LAN is scripted by deploy/https/setup.sh.
      #
      # http://localhost:8080 is the one origin Google accepts over plain http, so this
      # stack can exercise the real flow with no TLS. In the Google Cloud Console create
      # an OAuth 2.0 Web application client and set its authorized redirect URI to
      # exactly:  http://localhost:8080/signin-google
      # Full walkthrough: deploy/blazor-oauth-setup.md
      #
      # BLAZOR_AUTH_ALLOWED_EMAILS is a single address, which is all this local stack
      # needs; the Helm chart takes full lists. An empty allowlist is a startup failure,
      # never "allow everyone".
      Auth__Enabled: ${BLAZOR_AUTH_ENABLED:-false}
      Auth__PublicBaseUrl: ${BLAZOR_AUTH_PUBLIC_BASE_URL:-http://localhost:8080}
      Auth__Providers__Google__ClientId: ${BLAZOR_AUTH_GOOGLE_CLIENT_ID:-}
      Auth__Providers__Google__ClientSecret: ${BLAZOR_AUTH_GOOGLE_CLIENT_SECRET:-}
      Auth__Providers__Microsoft__ClientId: ${BLAZOR_AUTH_MICROSOFT_CLIENT_ID:-}
      Auth__Providers__Microsoft__ClientSecret: ${BLAZOR_AUTH_MICROSOFT_CLIENT_SECRET:-}
      Auth__Providers__Microsoft__TenantId: ${BLAZOR_AUTH_MICROSOFT_TENANT_ID:-}
      Auth__AllowedEmails__0: ${BLAZOR_AUTH_ALLOWED_EMAILS:-}
    volumes:
      - blazor-data:/data/blazor

  # HTTPS front end for LAN access (opt-in: COMPOSE_PROFILES=https). Let's Encrypt certificate via
  # a DNS-01 challenge on Azure DNS; set up with deploy/https/setup.sh.
  caddy:
    profiles: ["https"]
    build:
      context: ../caddy
    image: rockbot-caddy:local
    restart: unless-stopped
    depends_on:
      - blazor
    ports:
      - "443:443"
      - "8090:443"
    environment:
      RB_PUBLIC_HOST: ${RB_PUBLIC_HOST:-}
      AZURE_SUBSCRIPTION_ID: ${CADDY_AZURE_SUBSCRIPTION_ID:-}
      AZURE_RESOURCE_GROUP_NAME: ${CADDY_AZURE_RESOURCE_GROUP:-}
      AZURE_TENANT_ID: ${CADDY_AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${CADDY_AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${CADDY_AZURE_CLIENT_SECRET:-}
    volumes:
      - caddy-data:/data

volumes:
  rabbitmq-data:
  agent-data:
  shared:
  blazor-data:
  caddy-data:
  obsidian-vault:
  obsidian-config:
