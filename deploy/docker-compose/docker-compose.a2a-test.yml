name: rockbot-a2a-test

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rockbot
      RABBITMQ_DEFAULT_PASS: rockbot
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Mock OIDC identity provider — issues JWT access tokens (resource-owner password
  # grant) so the gateway can validate real Bearer tokens against a discoverable JWKS.
  # Issuer = http://oidc-server (the in-network hostname), used as the gateway Authority.
  oidc-server:
    image: ghcr.io/soluto/oidc-server-mock:0.9.0
    hostname: oidc-server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      SERVER_OPTIONS_INLINE: |
        {
          "AccessTokenJwtType": "JWT",
          "Discovery": { "ShowKeySet": true }
        }
      API_SCOPES_INLINE: |
        [ { "Name": "rockbot.a2a" } ]
      API_RESOURCES_INLINE: |
        [ { "Name": "rockbot-a2a", "Scopes": ["rockbot.a2a"], "UserClaims": ["name"] } ]
      USERS_CONFIGURATION_INLINE: |
        [ {
          "SubjectId": "a2a-caller-007",
          "Username": "caller",
          "Password": "pass",
          "Claims": [ { "Type": "name", "Value": "JWT Test Caller" } ]
        } ]
      CLIENTS_CONFIGURATION_INLINE: |
        [ {
          "ClientId": "rockbot-test-client",
          "ClientSecrets": [ "test-secret" ],
          "Description": "RockBot A2A test client",
          "AllowedGrantTypes": [ "password" ],
          "AllowedScopes": [ "openid", "profile", "rockbot.a2a" ],
          "AlwaysIncludeUserClaimsInIdToken": true,
          "RequireClientSecret": true
        } ]

  agent-init:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.agent
    image: rockylhotka/rockbot-agent:latest
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Seeding agent data volume for A2A test..."
        for f in soul.md directives.md subagent-directives.md worker-directives.md style.md memory-rules.md \
                 dream.md skill-dream.md common-directives.md session-evaluator.md \
                 session-start.md heartbeat-patrol.md skill-optimize.md \
                 dlq-dream.md routing-dream.md; do
          src="/app/agent/$$f"
          dst="/data/agent/$$f"
          if [ -f "$$src" ] && [ ! -s "$$dst" ]; then
            cp "$$src" "$$dst"
          fi
        done
        if [ -f /app/agent/well-known-agents.json ] && [ ! -s /data/agent/well-known-agents.json ]; then
          cp /app/agent/well-known-agents.json /data/agent/well-known-agents.json
        fi
        # Minimal mcp.json — no external MCP servers needed for A2A test
        if [ ! -f /data/agent/mcp.json ]; then
          echo '{"mcpServers":{}}' > /data/agent/mcp.json
        fi
        # Per-model behavior files
        for model_dir in /app/model-behaviors/*/; do
          [ -d "$$model_dir" ] || continue
          model_name=$$(basename "$$model_dir")
          mkdir -p "/data/agent/model-behaviors/$$model_name"
          for src in "$$model_dir"*; do
            [ -f "$$src" ] || continue
            dst="/data/agent/model-behaviors/$$model_name/$$(basename $$src)"
            if [ ! -s "$$dst" ]; then
              cp "$$src" "$$dst"
            fi
          done
        done
        mkdir -p /data/agent/memory /data/agent/skills /data/agent/conversations /data/agent/feedback
        chmod -R 777 /data/agent
        echo "Agent data volume ready."
    volumes:
      - agent-data:/data/agent

  rockbot-agent:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.agent
    image: rockylhotka/rockbot-agent:latest
    depends_on:
      agent-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: rockbot
      RabbitMq__Password: rockbot
      RabbitMq__VirtualHost: /
      AgentProfile__BasePath: /data/agent
      Memory__BasePath: /data/agent/memory
      Skill__BasePath: /data/agent/skills
      McpBridge__ConfigPath: /data/agent/mcp.json
      ModelBehaviors__BasePath: /data/agent/model-behaviors
      Agent__Timezone: America/Chicago
      # No LLM config — falls back to EchoChatClient (free, deterministic)
    volumes:
      - agent-data:/data/agent
      - shared:/rockbot/shared

  a2a-gateway:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.a2a-gateway
    depends_on:
      rockbot-agent:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      oidc-server:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5200
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: rockbot
      RabbitMq__Password: rockbot
      ApiKeys__test-key-001__AgentId: a2a-test-harness
      ApiKeys__test-key-001__DisplayName: A2A Test Harness
      # JWT/Bearer (generic OIDC) — validate tokens from the mock issuer. Audience
      # validation is left off (Jwt__Audience unset) to keep the test focused on
      # signature/issuer validation + claims propagation.
      Jwt__Authority: http://oidc-server
      Jwt__RequireHttpsMetadata: "false"
    volumes:
      - gateway-data:/app/data

  a2a-test-harness:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.a2a-test
    depends_on:
      a2a-gateway:
        condition: service_started
      rockbot-agent:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: rockbot
      RabbitMq__Password: rockbot
      A2A_GATEWAY_URL: http://a2a-gateway:5200
      A2A_GATEWAY_API_KEY: test-key-001
      TRUST_STORE_PATH: /data/agent/agent-trust.json
      # OIDC token endpoint + client/user creds for the JWT auth scenarios. Presence of
      # OIDC_TOKEN_ENDPOINT enables those scenarios; absent → they are skipped.
      OIDC_TOKEN_ENDPOINT: http://oidc-server/connect/token
      OIDC_CLIENT_ID: rockbot-test-client
      OIDC_CLIENT_SECRET: test-secret
      OIDC_USERNAME: caller
      OIDC_PASSWORD: pass
      OIDC_SCOPE: openid profile rockbot.a2a
      OIDC_EXPECTED_SUBJECT: a2a-caller-007
      OIDC_EXPECTED_ISSUER: http://oidc-server
    volumes:
      - agent-data:/data/agent:ro

volumes:
  agent-data:
  shared:
  gateway-data:
