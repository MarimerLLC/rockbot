# ResearchAgent as an MCP server (design/research-agent-mcp.md).
#
# One long-lived pod serves the MCP tool `research` at http://research-agent:8080/mcp
# (stateless streamable HTTP, with the Tasks extension). Its callers are the primary agent
# (through the MCP bridge, `"tasks": true` in mcp.json) and the AdvisorCouncil
# (Council__ResearchServerUrl). It no longer speaks A2A and needs no message broker.
#
#   kubectl apply -f deploy/k8s/research-agent.yaml
#
# One-time cleanup of the retired A2A path, on a cluster that still has it:
#
#   kubectl -n rockbot delete scaledjob rockbot-research-agent
#   # NOT `kubectl delete -f` of the old manifest: it also defined the TriggerAuthentication
#   # rockbot-keda-rabbitmq-auth, which the AdvisorCouncil ScaledJob still uses.
#   kubectl -n rockbot delete job research-agent-queue-init --ignore-not-found
#   # then delete the RabbitMQ queues rockbot.ResearchAgent.* (agent-task, agent-task-cancel,
#   # discovery, and their .dlq) in the RabbitMQ management UI or with rabbitmqadmin.
#
# One replica: the task store (InMemoryMcpTaskStore) and the Data Protection key ring that
# seals clarifying-question state are in memory. A restart loses in-flight tasks (callers see
# them as lost) and outstanding questions (the tool re-scopes). More replicas need a durable,
# shared task store and key ring.
#
# Concurrency: Research__MaxConcurrentRuns (default 3) caps research runs in this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rockbot-research-agent
  namespace: rockbot
  labels:
    app: rockbot-research-agent
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two pods would split tasks between two in-memory stores.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rockbot-research-agent
  template:
    metadata:
      labels:
        app: rockbot-research-agent
    spec:
      containers:
        - name: research-agent
          image: rockylhotka/rockbot-research-agent:0.16.17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Working memory lives on the container's local filesystem; each research run
            # clears its own research/{runId} namespace when it finishes. No PVC needed.
            - name: Memory__BasePath
              value: /tmp/memory
            - name: Research__MaxConcurrentRuns
              value: "3"
          envFrom:
            - configMapRef:
                name: rockbot-config
            - secretRef:
                name: rockbot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: research-agent
  namespace: rockbot
  labels:
    app: rockbot-research-agent
spec:
  type: ClusterIP
  selector:
    app: rockbot-research-agent
  ports:
    - port: 8080
      targetPort: 8080
      name: http
