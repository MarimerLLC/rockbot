{{- if .Values.azureFoundryMcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rockbot.fullname" . }}-azure-foundry-mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: azure-foundry-mcp
spec:
  type: ClusterIP
  selector:
    app: rockbot-azure-foundry-mcp
    {{- include "rockbot.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
