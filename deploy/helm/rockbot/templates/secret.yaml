{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rockbot.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
type: Opaque
# `data:` (base64), not `stringData:` — keep it that way (#709). The API server folds
# stringData into data and never stores it, so when a stringData key stops rendering
# (an optional value removed, a balancedModels entry shifting slot) helm upgrade's patch
# can only drop the stringData field, and the stale data key stays in the live secret.
# With data: the vanished key is in the three-way merge and gets deleted.
# Every value is `| toString | b64enc`: toString so a non-string value (a numeric
# password) still encodes.
data:
  # ── LLM — three-tier (Balanced is REQUIRED; Low and High are optional) ─────
  # Each tier can use a different provider: OpenAI-compatible (default), Copilot, or Anthropic.
  # Per-tier provider overrides the global LLM__Provider default.
  # Tier selection: user messages → keyword heuristic; patrol → Balanced; dream/research → High
  {{- if .Values.secrets.llm.provider }}
  LLM__Provider: {{ .Values.secrets.llm.provider | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.gitHubToken }}
  GITHUB_TOKEN: {{ .Values.secrets.llm.gitHubToken | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.balanced).provider) }}
  LLM__Balanced__Provider: {{ .Values.secrets.llm.balanced.provider | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.balanced.endpoint }}
  LLM__Balanced__Endpoint: {{ .Values.secrets.llm.balanced.endpoint | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.balanced.apiKey }}
  LLM__Balanced__ApiKey: {{ .Values.secrets.llm.balanced.apiKey | toString | b64enc | quote }}
  {{- end }}
  LLM__Balanced__ModelId: {{ required "secrets.llm.balanced.modelId is required" .Values.secrets.llm.balanced.modelId | toString | b64enc | quote }}
  {{- if ((.Values.secrets.llm.balanced).reasoningEffort) }}
  LLM__Balanced__ReasoningEffort: {{ .Values.secrets.llm.balanced.reasoningEffort | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.balanced).verbosity) }}
  LLM__Balanced__Verbosity: {{ .Values.secrets.llm.balanced.verbosity | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.balanced).supportsImageInput) }}
  LLM__Balanced__SupportsImageInput: {{ "true" | b64enc | quote }}
  {{- end }}
  {{- range $i, $m := .Values.secrets.llm.balancedModels }}
  {{- if $m.provider }}
  LLM__BalancedModels__{{ $i }}__Provider: {{ $m.provider | toString | b64enc | quote }}
  {{- end }}
  {{- if $m.endpoint }}
  LLM__BalancedModels__{{ $i }}__Endpoint: {{ $m.endpoint | toString | b64enc | quote }}
  {{- end }}
  {{- if $m.apiKey }}
  LLM__BalancedModels__{{ $i }}__ApiKey: {{ $m.apiKey | toString | b64enc | quote }}
  {{- end }}
  {{- if $m.modelId }}
  LLM__BalancedModels__{{ $i }}__ModelId: {{ $m.modelId | toString | b64enc | quote }}
  {{- end }}
  {{- if $m.verbosity }}
  LLM__BalancedModels__{{ $i }}__Verbosity: {{ $m.verbosity | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if ((.Values.secrets.llm.low).modelId) }}
  # Low tier — falls back to Balanced when not configured
  {{- if .Values.secrets.llm.low.provider }}
  LLM__Low__Provider: {{ .Values.secrets.llm.low.provider | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.low.endpoint }}
  LLM__Low__Endpoint: {{ .Values.secrets.llm.low.endpoint | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.low.apiKey }}
  LLM__Low__ApiKey: {{ .Values.secrets.llm.low.apiKey | toString | b64enc | quote }}
  {{- end }}
  LLM__Low__ModelId: {{ .Values.secrets.llm.low.modelId | toString | b64enc | quote }}
  {{- if ((.Values.secrets.llm.low).reasoningEffort) }}
  LLM__Low__ReasoningEffort: {{ .Values.secrets.llm.low.reasoningEffort | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.low).verbosity) }}
  LLM__Low__Verbosity: {{ .Values.secrets.llm.low.verbosity | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.low).supportsImageInput) }}
  LLM__Low__SupportsImageInput: {{ "true" | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if ((.Values.secrets.llm.high).modelId) }}
  # High tier — falls back to Balanced when not configured
  {{- if .Values.secrets.llm.high.provider }}
  LLM__High__Provider: {{ .Values.secrets.llm.high.provider | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.high.endpoint }}
  LLM__High__Endpoint: {{ .Values.secrets.llm.high.endpoint | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.high.apiKey }}
  LLM__High__ApiKey: {{ .Values.secrets.llm.high.apiKey | toString | b64enc | quote }}
  {{- end }}
  LLM__High__ModelId: {{ .Values.secrets.llm.high.modelId | toString | b64enc | quote }}
  {{- if ((.Values.secrets.llm.high).reasoningEffort) }}
  LLM__High__ReasoningEffort: {{ .Values.secrets.llm.high.reasoningEffort | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.high).verbosity) }}
  LLM__High__Verbosity: {{ .Values.secrets.llm.high.verbosity | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.high).supportsImageInput) }}
  LLM__High__SupportsImageInput: {{ "true" | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if ((.Values.secrets.llm).endpoint) }}
  # Backward compat — flat keys (remove after all deployments migrated to three-tier)
  LLM__Endpoint: {{ .Values.secrets.llm.endpoint | toString | b64enc | quote }}
  LLM__ApiKey: {{ .Values.secrets.llm.apiKey | toString | b64enc | quote }}
  LLM__ModelId: {{ .Values.secrets.llm.modelId | toString | b64enc | quote }}
  {{- end }}
  {{- if ((.Values.secrets.embedding).model) }}
  # ── Embedding (optional) — hybrid BM25 + vector search ──────────────────────
  Embedding__Endpoint: {{ required "secrets.embedding.endpoint is required when embedding.model is set" .Values.secrets.embedding.endpoint | toString | b64enc | quote }}
  Embedding__Model: {{ .Values.secrets.embedding.model | toString | b64enc | quote }}
  {{- if .Values.secrets.embedding.apiKey }}
  Embedding__ApiKey: {{ .Values.secrets.embedding.apiKey | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
  # ── Web search ────────────────────────────────────────────────────────────────
  WebTools__ApiKey: {{ required "secrets.webTools.apiKey is required" .Values.secrets.webTools.apiKey | toString | b64enc | quote }}
  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  RabbitMq__Password: {{ required "secrets.rabbitmq.password is required" .Values.secrets.rabbitmq.password | toString | b64enc | quote }}
  {{- if .Values.blazor.auth.enabled }}
  # ── Blazor UI OAuth (client ID is in the ConfigMap; only the secret is here) ──
  Auth__Providers__Google__ClientSecret: {{ required "secrets.auth.google.clientSecret is required when blazor.auth.enabled=true" ((.Values.secrets.auth).google).clientSecret | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.openrouterMcp.enabled }}
  # ── OpenRouter MCP (management API — separate from the LLM key) ───────────────
  OpenRouter__ApiKey: {{ required "secrets.openRouter.apiKey is required when openrouterMcp.enabled=true" .Values.secrets.openRouter.apiKey | toString | b64enc | quote }}
  {{- end }}
  {{- $decision := default dict .Values.agent.decisionModel }}
  {{- if and $decision.endpoint $decision.deployment }}
  # ── Shared decision model (falls back to the balanced tier's key) ──────────────
  DecisionModel__ApiKey: {{ required "secrets.decisionModel.apiKey or secrets.llm.balanced.apiKey is required when agent.decisionModel is set" (((.Values.secrets).decisionModel).apiKey | default .Values.secrets.llm.balanced.apiKey) | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.azureFoundryMcp.enabled }}
  # ── Azure AI Foundry MCP (service principal for DefaultAzureCredential) ────────
  AzureFoundry__TenantId: {{ required "secrets.azureFoundry.tenantId is required when azureFoundryMcp.enabled=true" .Values.secrets.azureFoundry.tenantId | toString | b64enc | quote }}
  AzureFoundry__ClientId: {{ required "secrets.azureFoundry.clientId is required when azureFoundryMcp.enabled=true" .Values.secrets.azureFoundry.clientId | toString | b64enc | quote }}
  AzureFoundry__ClientSecret: {{ required "secrets.azureFoundry.clientSecret is required when azureFoundryMcp.enabled=true" .Values.secrets.azureFoundry.clientSecret | toString | b64enc | quote }}
  {{- end }}
{{- end }}
