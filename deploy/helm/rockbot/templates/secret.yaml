{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rockbot.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── LLM — three-tier (Balanced is REQUIRED; Low and High are optional) ─────
  # Each tier can use a different provider: OpenAI-compatible (default) or Copilot.
  # Per-tier provider overrides the global LLM__Provider default.
  # Tier selection: user messages → keyword heuristic; patrol → Balanced; dream/research → High
  {{- if .Values.secrets.llm.provider }}
  LLM__Provider: {{ .Values.secrets.llm.provider | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.gitHubToken }}
  GITHUB_TOKEN: {{ .Values.secrets.llm.gitHubToken | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.balanced).provider) }}
  LLM__Balanced__Provider: {{ .Values.secrets.llm.balanced.provider | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.balanced.endpoint }}
  LLM__Balanced__Endpoint: {{ .Values.secrets.llm.balanced.endpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.balanced.apiKey }}
  LLM__Balanced__ApiKey: {{ .Values.secrets.llm.balanced.apiKey | quote }}
  {{- end }}
  LLM__Balanced__ModelId: {{ required "secrets.llm.balanced.modelId is required" .Values.secrets.llm.balanced.modelId | quote }}
  {{- range $i, $m := .Values.secrets.llm.balancedModels }}
  {{- if $m.provider }}
  LLM__BalancedModels__{{ $i }}__Provider: {{ $m.provider | quote }}
  {{- end }}
  {{- if $m.endpoint }}
  LLM__BalancedModels__{{ $i }}__Endpoint: {{ $m.endpoint | quote }}
  {{- end }}
  {{- if $m.apiKey }}
  LLM__BalancedModels__{{ $i }}__ApiKey: {{ $m.apiKey | quote }}
  {{- end }}
  {{- if $m.modelId }}
  LLM__BalancedModels__{{ $i }}__ModelId: {{ $m.modelId | quote }}
  {{- end }}
  {{- end }}
  {{- if ((.Values.secrets.llm.low).modelId) }}
  # Low tier — falls back to Balanced when not configured
  {{- if .Values.secrets.llm.low.provider }}
  LLM__Low__Provider: {{ .Values.secrets.llm.low.provider | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.low.endpoint }}
  LLM__Low__Endpoint: {{ .Values.secrets.llm.low.endpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.low.apiKey }}
  LLM__Low__ApiKey: {{ .Values.secrets.llm.low.apiKey | quote }}
  {{- end }}
  LLM__Low__ModelId: {{ .Values.secrets.llm.low.modelId | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm.high).modelId) }}
  # High tier — falls back to Balanced when not configured
  {{- if .Values.secrets.llm.high.provider }}
  LLM__High__Provider: {{ .Values.secrets.llm.high.provider | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.high.endpoint }}
  LLM__High__Endpoint: {{ .Values.secrets.llm.high.endpoint | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.high.apiKey }}
  LLM__High__ApiKey: {{ .Values.secrets.llm.high.apiKey | quote }}
  {{- end }}
  LLM__High__ModelId: {{ .Values.secrets.llm.high.modelId | quote }}
  {{- end }}
  {{- if ((.Values.secrets.llm).endpoint) }}
  # Backward compat — flat keys (remove after all deployments migrated to three-tier)
  LLM__Endpoint: {{ .Values.secrets.llm.endpoint | quote }}
  LLM__ApiKey: {{ .Values.secrets.llm.apiKey | quote }}
  LLM__ModelId: {{ .Values.secrets.llm.modelId | quote }}
  {{- end }}
  {{- if ((.Values.secrets.embedding).model) }}
  # ── Embedding (optional) — hybrid BM25 + vector search ──────────────────────
  Embedding__Endpoint: {{ required "secrets.embedding.endpoint is required when embedding.model is set" .Values.secrets.embedding.endpoint | quote }}
  Embedding__Model: {{ .Values.secrets.embedding.model | quote }}
  {{- if .Values.secrets.embedding.apiKey }}
  Embedding__ApiKey: {{ .Values.secrets.embedding.apiKey | quote }}
  {{- end }}
  {{- end }}
  # ── Web search ────────────────────────────────────────────────────────────────
  WebTools__ApiKey: {{ required "secrets.webTools.apiKey is required" .Values.secrets.webTools.apiKey | quote }}
  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  RabbitMq__Password: {{ required "secrets.rabbitmq.password is required" .Values.secrets.rabbitmq.password | quote }}
  {{- if .Values.openrouterMcp.enabled }}
  # ── OpenRouter MCP (management API — separate from the LLM key) ───────────────
  OpenRouter__ApiKey: {{ required "secrets.openRouter.apiKey is required when openrouterMcp.enabled=true" .Values.secrets.openRouter.apiKey | quote }}
  {{- end }}
  {{- if .Values.azureFoundryMcp.enabled }}
  # ── Azure AI Foundry MCP (service principal for DefaultAzureCredential) ────────
  AzureFoundry__TenantId: {{ required "secrets.azureFoundry.tenantId is required when azureFoundryMcp.enabled=true" .Values.secrets.azureFoundry.tenantId | quote }}
  AzureFoundry__ClientId: {{ required "secrets.azureFoundry.clientId is required when azureFoundryMcp.enabled=true" .Values.secrets.azureFoundry.clientId | quote }}
  AzureFoundry__ClientSecret: {{ required "secrets.azureFoundry.clientSecret is required when azureFoundryMcp.enabled=true" .Values.secrets.azureFoundry.clientSecret | quote }}
  {{- end }}
{{- end }}
