{{- $tsTags := include "rockbot.blazor.tailscaleTags" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rockbot.fullname" . }}-blazor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: blazor
{{- if not (or .Values.blazor.tailscale.ingress.enabled .Values.blazor.ingress.enabled) }}
  annotations:
    # Tailscale Kubernetes Operator — exposes this service on your tailnet
    # at <hostname> (no Funnel, private to tailnet only).
    # Requires: https://tailscale.com/kb/1236/kubernetes-operator
    tailscale.com/hostname: {{ .Values.blazor.tailscale.hostname | quote }}
    {{- if $tsTags }}
    # ACL identity for this endpoint. See blazor.tailscale.tags in values.yaml.
    tailscale.com/tags: {{ $tsTags | quote }}
    {{- end }}
{{- end }}
spec:
{{- if or .Values.blazor.tailscale.ingress.enabled .Values.blazor.ingress.enabled }}
  # Behind an Ingress, this Service is a plain in-cluster backend.
  #
  # In tailnet layer-7 mode the Ingress owns the Tailscale device and terminates
  # TLS. It must NOT also be a tailscale LoadBalancer — two devices competing for
  # <hostname> means the loser is renamed <hostname>-1 and the certificate follows
  # the wrong name. The tags annotation lives on the Ingress in that mode, not here.
  #
  # With the generic HTTPS ingress there may be no Tailscale operator installed at
  # all, in which case a LoadBalancer of class tailscale would simply hang Pending.
  type: ClusterIP
{{- else }}
  type: LoadBalancer
  loadBalancerClass: tailscale
{{- end }}
  selector:
    app: rockbot-blazor
    {{- include "rockbot.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
