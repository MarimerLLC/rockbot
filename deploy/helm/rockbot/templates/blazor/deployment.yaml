apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rockbot.fullname" . }}-blazor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: blazor
spec:
  replicas: {{ .Values.blazor.replicaCount }}
  selector:
    matchLabels:
      app: rockbot-blazor
      {{- include "rockbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: rockbot-blazor
        {{- include "rockbot.labels" . | nindent 8 }}
        {{- include "rockbot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: blazor
    spec:
      # Match the shared-data fsGroup so files the agent wrote (group rw via its own fsGroup)
      # are readable here. The PVC is co-mounted read-only solely to serve attachments.
      securityContext:
        fsGroup: {{ .Values.shared.fsGroup }}
      containers:
        - name: blazor
          image: {{ .Values.blazor.image.repository }}:{{ .Values.blazor.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          # Blazor only needs RabbitMQ config — pull specific keys rather than
          # the whole agent ConfigMap to keep the pod's env minimal.
          env:
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__HostName
            - name: RabbitMq__Port
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__Port
            - name: RabbitMq__UserName
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__UserName
            - name: RabbitMq__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__VirtualHost
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "rockbot.secretName" . }}
                  key: RabbitMq__Password
            # Where the shared attachments directory is mounted — the /attachments endpoint
            # resolves AgentReply.Attachments file references under ${ROCKBOT_SHARED_PATH}/attachments.
            - name: ROCKBOT_SHARED_PATH
              value: "/rockbot/shared"
            {{- if .Values.workiq.enabled }}
            # WorkIQ device-code flow needs the same Entra app registration
            # values the agent uses. Cache itself never lands on the Blazor pod.
            - name: WorkIQ__TenantId
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: WorkIQ__TenantId
            - name: WorkIQ__ClientId
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: WorkIQ__ClientId
            {{- if .Values.workiq.scopes }}
            - name: WorkIQ__Scopes
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: WorkIQ__Scopes
            {{- end }}
            {{- if .Values.workiq.authority }}
            - name: WorkIQ__Authority
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: WorkIQ__Authority
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.blazor.resources | nindent 12 }}
          volumeMounts:
            # Read-only: Blazor only serves attachment bytes; the agent owns writes.
            - name: shared-data
              mountPath: /rockbot/shared
              readOnly: true
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "rockbot.sharedPvcName" . }}
