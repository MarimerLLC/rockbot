{{- if and .Values.agui.enabled .Values.agui.ingress.enabled }}
{{- if .Values.agui.tailscale.ingress.enabled }}
{{- fail "agui.ingress.enabled and agui.tailscale.ingress.enabled are mutually exclusive — two Ingresses pointing at one Service with different ingressClassNames is not a supported configuration. Pick the tailnet path or the public HTTPS path." }}
{{- end }}
{{- $host := required "agui.ingress.host is required when agui.ingress.enabled=true" .Values.agui.ingress.host }}
{{- if and (not (default dict .Values.agui.auth).enabled) (not .Values.agui.ingress.allowUnauthenticated) }}
{{- fail "agui.ingress.enabled=true with agui.auth.enabled=false would publish the AG-UI API with no gate in front of it: anyone who can reach it can talk to the agent. Enable agui.auth, or set agui.ingress.allowUnauthenticated=true if something outside this chart (an oauth2-proxy, an authenticating gateway) is doing the gating." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rockbot.fullname" . }}-agui-https
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: agui
  {{- with .Values.agui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.agui.ingress.className | quote }}
  {{- if .Values.agui.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "agui.ingress.tls.secretName is required when agui.ingress.tls.enabled=true" .Values.agui.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rockbot.fullname" . }}-agui
                port:
                  number: 80
{{- end }}
