{{- if .Values.agui.enabled }}
{{- /* `default dict`, so a --reuse-values upgrade from a release without these blocks still renders. */}}
{{- $auth := default dict .Values.agui.auth }}
{{- $cors := default dict .Values.agui.cors }}
{{- if $auth.enabled }}
{{- if and (not $auth.allowedEmails) (not $auth.allowedDomains) }}
{{- fail "agui.auth.enabled=true with both agui.auth.allowedEmails and agui.auth.allowedDomains empty. An empty allowlist lets nobody in, and is never read as \"everyone at the provider\" — set at least one entry. (The proxy also refuses to start in this state; failing here saves you a CrashLoopBackOff.)" }}
{{- end }}
{{- if not $auth.audiences }}
{{- fail "agui.auth.enabled=true with agui.auth.audiences empty. List the OAuth client id of every app allowed to call the API: without an audience, a token the provider issued to any other app would be accepted. (The proxy also refuses to start in this state.)" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rockbot.fullname" . }}-agui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: agui
spec:
  replicas: {{ .Values.agui.replicaCount }}
  selector:
    matchLabels:
      app: rockbot-agui
      {{- include "rockbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: rockbot-agui
        {{- include "rockbot.labels" . | nindent 8 }}
        {{- include "rockbot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agui
    spec:
      # Stateless: no volume of its own. The proxy's identity on the bus is agui-<pod name>,
      # and its queues are ephemeral, so a replaced pod leaves nothing behind on the broker.
      # The shared PVC is co-mounted read-only, solely to serve attachments; the fsGroup
      # matches the shared data's, so files the agent wrote (group rw) are readable here.
      securityContext:
        fsGroup: {{ .Values.shared.fsGroup }}
      containers:
        - name: agui
          image: {{ .Values.agui.image.repository }}:{{ .Values.agui.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          # The proxy only needs RabbitMQ config — pull specific keys rather than
          # the whole agent ConfigMap to keep the pod's env minimal.
          env:
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__HostName
            - name: RabbitMq__Port
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__Port
            - name: RabbitMq__UserName
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__UserName
            - name: RabbitMq__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__VirtualHost
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "rockbot.secretName" . }}
                  key: RabbitMq__Password
            # Where the shared attachments directory is mounted: GET /attachments/{path} serves
            # files under ${ROCKBOT_SHARED_PATH}/attachments.
            - name: ROCKBOT_SHARED_PATH
              value: "/rockbot/shared"
            {{- if .Values.agent.attachmentUpload.enabled }}
            # Upload attachments to the agent over HTTP rather than putting their bytes through
            # RabbitMQ. Unset this and uploads still work — they just fall back to the bus.
            - name: UserProxy__AttachmentUploadUrl
              value: "http://{{ include "rockbot.fullname" . }}-agent:{{ .Values.agent.attachmentUpload.port | default 8082 }}"
            {{- end }}
            {{- with .Values.agui.publicBaseUrl }}
            # The address browsers reach the proxy at; the MCP sign-in redirect URI is built from it.
            - name: AgUi__PublicBaseUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agui.replyTimeout }}
            # How long a run waits for the agent to start working on it.
            - name: UserProxy__ReplyTimeout
              value: {{ . | quote }}
            {{- end }}
            {{- range $i, $threadId := .Values.agui.allowedThreadIds }}
            - name: AgUi__AllowedThreadIds__{{ $i }}
              value: {{ $threadId | quote }}
            {{- end }}
            # App auth (bearer tokens). The proxy's own keys, under AgUi__Auth__: the Blazor
            # UI's Auth__* keys in the ConfigMap are not read here, and these are not read
            # there. Always emitted, so switching it off in values switches it off in the pod.
            - name: AgUi__Auth__Enabled
              value: {{ $auth.enabled | default false | quote }}
            {{- if $auth.enabled }}
            {{- with $auth.authority }}
            - name: AgUi__Auth__Authority
              value: {{ . | quote }}
            {{- end }}
            {{- range $i, $audience := $auth.audiences }}
            - name: AgUi__Auth__Audiences__{{ $i }}
              value: {{ $audience | quote }}
            {{- end }}
            {{- range $i, $email := $auth.allowedEmails }}
            - name: AgUi__Auth__AllowedEmails__{{ $i }}
              value: {{ $email | quote }}
            {{- end }}
            {{- range $i, $domain := $auth.allowedDomains }}
            - name: AgUi__Auth__AllowedDomains__{{ $i }}
              value: {{ $domain | quote }}
            {{- end }}
            {{- if $auth.ticketKeyFromSecret }}
            # One ticket-signing key for every replica. Without it each pod makes its own.
            - name: AgUi__Auth__TicketKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "rockbot.secretName" . }}
                  key: AgUi__Auth__TicketKey
            {{- end }}
            {{- end }}
            {{- range $i, $origin := $cors.allowedOrigins }}
            # A browser origin that may call the API.
            - name: AgUi__Cors__AllowedOrigins__{{ $i }}
              value: {{ $origin | quote }}
            {{- end }}
          # /healthz answers 200 only while the proxy holds its subscriptions on the bus.
          # Liveness is lenient (5 minutes): a proxy that starts before the broker is up
          # retries on its own for about that long, and only then is a restart the fix.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agui.resources | nindent 12 }}
          volumeMounts:
            # Read-only: the proxy only serves attachment bytes; the agent owns writes.
            - name: shared-data
              mountPath: /rockbot/shared
              readOnly: true
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "rockbot.sharedPvcName" . }}
{{- end }}
