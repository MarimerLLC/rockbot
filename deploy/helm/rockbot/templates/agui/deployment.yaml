{{- if .Values.agui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rockbot.fullname" . }}-agui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: agui
spec:
  replicas: {{ .Values.agui.replicaCount }}
  selector:
    matchLabels:
      app: rockbot-agui
      {{- include "rockbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: rockbot-agui
        {{- include "rockbot.labels" . | nindent 8 }}
        {{- include "rockbot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agui
    spec:
      # Stateless: no volume of its own. The proxy's identity on the bus is agui-<pod name>,
      # and its queues are ephemeral, so a replaced pod leaves nothing behind on the broker.
      # The shared PVC is co-mounted read-only, solely to serve attachments; the fsGroup
      # matches the shared data's, so files the agent wrote (group rw) are readable here.
      securityContext:
        fsGroup: {{ .Values.shared.fsGroup }}
      containers:
        - name: agui
          image: {{ .Values.agui.image.repository }}:{{ .Values.agui.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          # The proxy only needs RabbitMQ config — pull specific keys rather than
          # the whole agent ConfigMap to keep the pod's env minimal.
          env:
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__HostName
            - name: RabbitMq__Port
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__Port
            - name: RabbitMq__UserName
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__UserName
            - name: RabbitMq__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rockbot.configmapName" . }}
                  key: RabbitMq__VirtualHost
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "rockbot.secretName" . }}
                  key: RabbitMq__Password
            # Where the shared attachments directory is mounted: GET /attachments/{path} serves
            # files under ${ROCKBOT_SHARED_PATH}/attachments.
            - name: ROCKBOT_SHARED_PATH
              value: "/rockbot/shared"
            {{- if .Values.agent.attachmentUpload.enabled }}
            # Upload attachments to the agent over HTTP rather than putting their bytes through
            # RabbitMQ. Unset this and uploads still work — they just fall back to the bus.
            - name: UserProxy__AttachmentUploadUrl
              value: "http://{{ include "rockbot.fullname" . }}-agent:{{ .Values.agent.attachmentUpload.port | default 8082 }}"
            {{- end }}
            {{- with .Values.agui.publicBaseUrl }}
            # The address browsers reach the proxy at; the MCP sign-in redirect URI is built from it.
            - name: AgUi__PublicBaseUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agui.replyTimeout }}
            # How long a run waits for the agent to start working on it.
            - name: UserProxy__ReplyTimeout
              value: {{ . | quote }}
            {{- end }}
            {{- range $i, $threadId := .Values.agui.allowedThreadIds }}
            - name: AgUi__AllowedThreadIds__{{ $i }}
              value: {{ $threadId | quote }}
            {{- end }}
          # /healthz answers 200 only while the proxy holds its subscriptions on the bus.
          # Liveness is lenient (5 minutes): a proxy that starts before the broker is up
          # retries on its own for about that long, and only then is a restart the fix.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agui.resources | nindent 12 }}
          volumeMounts:
            # Read-only: the proxy only serves attachment bytes; the agent owns writes.
            - name: shared-data
              mountPath: /rockbot/shared
              readOnly: true
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "rockbot.sharedPvcName" . }}
{{- end }}
