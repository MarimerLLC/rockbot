apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rockbot.fullname" . }}-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  # Recreate ensures only one agent runs at a time — the agent is stateful
  # (memory, working state) and must not run as concurrent replicas.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rockbot-agent
      {{- include "rockbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: rockbot-agent
        {{- include "rockbot.labels" . | nindent 8 }}
        {{- include "rockbot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "rockbot.agentServiceAccountName" . }}
      # fsGroup applies to every volume in this Pod: kubelet chgrp's them to this
      # GID, sets setgid on dirs, and OR's group rw into the mode. On
      # /rockbot/shared it lets the agent (UID 999), shared-cleanup (UID 0), and
      # script pods (UID 1000) read/write each other's files. On /data/agent it is
      # what lets the introspection sidecar — a different uid — write agent-name.md,
      # so the init container must preserve this group rather than chown over it.
      securityContext:
        fsGroup: {{ .Values.shared.fsGroup }}

      initContainers:
        - name: init-agent-data
          # Use the same image so we can copy the baked-in default agent files
          # to the PVC. cp -n (no-clobber) means customised files are never overwritten.
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Run as root so we can write to the freshly-provisioned PVC (owned by root)
          # and then chown it to the rockbot user before the main container starts.
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Initializing agent data volume..."

              # Profile and dream directives — live at /app/agent/*.md in the image.
              # Copy every .md file no-clobber so operators can tune any directive
              # (including dream passes) on the PVC without a rebuild, and new
              # directives added in future releases get seeded automatically.
              for src in /app/agent/*.md; do
                [ -f "$src" ] || continue
                f=$(basename "$src")
                dst="/data/agent/$f"
                if [ ! -s "$dst" ]; then
                  echo "  Copying default $f"
                  cp "$src" "$dst"
                fi
              done

              # mcp.json lives at /app/mcp.json in the image (not under agent/)
              if [ ! -f /data/agent/mcp.json ]; then
                echo "  Copying default mcp.json"
                cp /app/mcp.json /data/agent/mcp.json
              fi

              # llm-pricing.json — operator-editable pricing table consumed by LlmCostEstimator.
              # Copy no-clobber so manual price tweaks survive image upgrades.
              if [ -f /app/agent/llm-pricing.json ] && [ ! -s /data/agent/llm-pricing.json ]; then
                echo "  Copying default llm-pricing.json"
                cp /app/agent/llm-pricing.json /data/agent/llm-pricing.json
              fi

              # merge-coverage-vocabulary.json — per-deployment word list for the dream
              # merge-coverage safeguard. Copy no-clobber so operator tuning survives upgrades.
              if [ -f /app/agent/merge-coverage-vocabulary.json ] && [ ! -s /data/agent/merge-coverage-vocabulary.json ]; then
                echo "  Copying default merge-coverage-vocabulary.json"
                cp /app/agent/merge-coverage-vocabulary.json /data/agent/merge-coverage-vocabulary.json
              fi

              # Per-model behavior prompt files — copy per-file so users can customise
              # individual prompts without losing others on upgrade
              for model_dir in /app/model-behaviors/*/; do
                [ -d "$model_dir" ] || continue
                model_name=$(basename "$model_dir")
                mkdir -p "/data/agent/model-behaviors/$model_name"
                for src in "$model_dir"*; do
                  [ -f "$src" ] || continue
                  dst="/data/agent/model-behaviors/$model_name/$(basename "$src")"
                  if [ ! -s "$dst" ]; then
                    echo "  Copying model-behaviors/$model_name/$(basename $src)"
                    cp "$src" "$dst"
                  fi
                done
              done

              # Runtime directories
              mkdir -p /data/agent/memory /data/agent/skills

              # Secrets directory (workiq token cache and any future per-user
              # credential material). Mode 0700 keeps it private to the rockbot
              # user even though the PVC is single-tenant.
              mkdir -p /data/agent/secrets
              chmod 700 /data/agent/secrets

              # Hand ownership to the rockbot user so the main container (non-root)
              # can read and write the volume. The user exists in the image.
              #
              # The GROUP is deliberately the pod's fsGroup, not rockbot's own gid.
              # kubelet already chgrp'd this volume to fsGroup at mount time; chowning
              # to rockbot:rockbot would clobber that and leave the volume group-owned
              # by gid 999. The introspection sidecar runs as a different uid (1654 in
              # its image) and is only ever in the fsGroup, so it would then fall
              # through to "others" and lose write — which is exactly what broke
              # set_agent_name, whose target file lives in this directory.
              # secrets/ stays 0700 above, so it remains private to the rockbot user
              # regardless of the group.
              chown -R rockbot:{{ .Values.shared.fsGroup }} /data/agent
              echo "Agent data volume ready."
          volumeMounts:
            - name: agent-data
              mountPath: /data/agent

      containers:
        - name: agent
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "rockbot.configmapName" . }}
            - secretRef:
                name: {{ include "rockbot.secretName" . }}
          volumeMounts:
            - name: agent-data
              mountPath: /data/agent
            - name: shared-data
              mountPath: /rockbot/shared
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}

        {{- if (default dict .Values.introspectionMcp).enabled }}
        # Introspection MCP runs as a sidecar so it can read agent state directly
        # from the PVC at /data/agent (memory, skills, mcp.json, profile files,
        # tier-routing-log.jsonl, llm-pricing.json, tier-selector.json). Listens on
        # 8081 — keeping the port stable preserves existing McpBridge config.
        - name: introspection-mcp
          image: {{ .Values.introspectionMcp.image.repository }}:{{ .Values.introspectionMcp.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http-introsp
              containerPort: 8081
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8081
            - name: AgentName__Path
              value: /data/agent/agent-name.md
          volumeMounts:
            # NOT readOnly. AgentName__Path above points the set_agent_name tool at
            # /data/agent/agent-name.md, so a read-only mount makes that tool fail with
            # "Read-only file system" every time — it was added after the agent-name
            # feature and silently broke it. The sidecar's tool surface is fixed and
            # only ever writes that one path, so this does not widen what the LLM can
            # reach; the agent container in this same Pod already mounts the volume rw.
            - name: agent-data
              mountPath: /data/agent
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.introspectionMcp.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: {{ include "rockbot.agentPvcName" . }}
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "rockbot.sharedPvcName" . }}
