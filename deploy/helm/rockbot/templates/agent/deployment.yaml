apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rockbot.fullname" . }}-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  # Recreate ensures only one agent runs at a time — the agent is stateful
  # (memory, working state) and must not run as concurrent replicas.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rockbot-agent
      {{- include "rockbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: rockbot-agent
        {{- include "rockbot.labels" . | nindent 8 }}
        {{- include "rockbot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "rockbot.agentServiceAccountName" . }}

      initContainers:
        - name: init-agent-data
          # Use the same image so we can copy the baked-in default agent files
          # to the PVC. cp -n (no-clobber) means customised files are never overwritten.
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Run as root so we can write to the freshly-provisioned PVC (owned by root)
          # and then chown it to the rockbot user before the main container starts.
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Initializing agent data volume..."

              # Profile and dream directives — live at /app/agent/*.md in the image.
              # Copy every .md file no-clobber so operators can tune any directive
              # (including dream passes) on the PVC without a rebuild, and new
              # directives added in future releases get seeded automatically.
              for src in /app/agent/*.md; do
                [ -f "$src" ] || continue
                f=$(basename "$src")
                dst="/data/agent/$f"
                if [ ! -s "$dst" ]; then
                  echo "  Copying default $f"
                  cp "$src" "$dst"
                fi
              done

              # mcp.json lives at /app/mcp.json in the image (not under agent/)
              if [ ! -f /data/agent/mcp.json ]; then
                echo "  Copying default mcp.json"
                cp /app/mcp.json /data/agent/mcp.json
              fi

              # Per-model behavior prompt files — copy per-file so users can customise
              # individual prompts without losing others on upgrade
              for model_dir in /app/model-behaviors/*/; do
                [ -d "$model_dir" ] || continue
                model_name=$(basename "$model_dir")
                mkdir -p "/data/agent/model-behaviors/$model_name"
                for src in "$model_dir"*; do
                  [ -f "$src" ] || continue
                  dst="/data/agent/model-behaviors/$model_name/$(basename "$src")"
                  if [ ! -s "$dst" ]; then
                    echo "  Copying model-behaviors/$model_name/$(basename $src)"
                    cp "$src" "$dst"
                  fi
                done
              done

              # Runtime directories
              mkdir -p /data/agent/memory /data/agent/skills

              # Hand ownership to the rockbot user so the main container (non-root)
              # can read and write the volume. The user exists in the image.
              chown -R rockbot:rockbot /data/agent
              echo "Agent data volume ready."
          volumeMounts:
            - name: agent-data
              mountPath: /data/agent

      containers:
        - name: agent
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "rockbot.configmapName" . }}
            - secretRef:
                name: {{ include "rockbot.secretName" . }}
          volumeMounts:
            - name: agent-data
              mountPath: /data/agent
            - name: shared-data
              mountPath: /rockbot/shared
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}

        {{- if .Values.routingStatsMcp.enabled }}
        - name: routing-stats-mcp
          image: {{ .Values.routingStatsMcp.image.repository }}:{{ .Values.routingStatsMcp.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: agent-data
              mountPath: /data/agent
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.routingStatsMcp.resources | nindent 12 }}
        {{- end }}

      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: {{ include "rockbot.agentPvcName" . }}
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "rockbot.sharedPvcName" . }}
