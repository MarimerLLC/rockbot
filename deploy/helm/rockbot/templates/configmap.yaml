apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rockbot.configmapName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
data:
  # ── RabbitMQ (non-secret) ──────────────────────────────────────────────────
  RabbitMq__HostName: {{ required "rabbitmq.hostName is required" .Values.rabbitmq.hostName | quote }}
  RabbitMq__Port: {{ .Values.rabbitmq.port | quote }}
  RabbitMq__UserName: {{ required "rabbitmq.userName is required" .Values.rabbitmq.userName | quote }}
  RabbitMq__VirtualHost: {{ .Values.rabbitmq.virtualHost | quote }}
  {{- if .Values.rabbitmq.managementApiBaseUrl }}
  RabbitMq__ManagementApiBaseUrl: {{ .Values.rabbitmq.managementApiBaseUrl | quote }}
  {{- end }}

  # ── Blazor UI OAuth sign-in (non-secret half) ──────────────────────────────
  # Always emitted so a helm upgrade that turns auth off actually turns it off,
  # rather than leaving a stale "true" in the pod's environment.
  Auth__Enabled: {{ .Values.blazor.auth.enabled | quote }}
  {{- if .Values.blazor.auth.enabled }}
  {{- if and (not .Values.blazor.auth.allowedEmails) (not .Values.blazor.auth.allowedDomains) }}
  {{- fail "blazor.auth.enabled=true with both blazor.auth.allowedEmails and blazor.auth.allowedDomains empty. An empty allowlist means every account at the configured provider can open a full agent session — set at least one entry. (The app also refuses to start in this state; failing here saves you a CrashLoopBackOff.)" }}
  {{- end }}
  Auth__PublicBaseUrl: {{ .Values.blazor.auth.publicBaseUrl | quote }}
  Auth__TrustForwardedHeaders: {{ .Values.blazor.auth.trustForwardedHeaders | quote }}
  Auth__SessionLifetime: {{ .Values.blazor.auth.sessionLifetime | quote }}
  Auth__Providers__Google__ClientId: {{ required "blazor.auth.google.clientId is required when blazor.auth.enabled=true" .Values.blazor.auth.google.clientId | quote }}
  {{- range $i, $email := .Values.blazor.auth.allowedEmails }}
  Auth__AllowedEmails__{{ $i }}: {{ $email | quote }}
  {{- end }}
  {{- range $i, $domain := .Values.blazor.auth.allowedDomains }}
  Auth__AllowedDomains__{{ $i }}: {{ $domain | quote }}
  {{- end }}
  {{- end }}

  # ── Ephemeral script runner ────────────────────────────────────────────────
  Scripts__Container__Namespace: {{ .Values.namespace | quote }}
  Scripts__Container__Image: {{ .Values.scripts.image | quote }}
  Scripts__Container__CpuLimit: {{ .Values.scripts.cpuLimit | quote }}
  Scripts__Container__MemoryLimit: {{ .Values.scripts.memoryLimit | quote }}
  Scripts__Container__SharedVolumeClaim: {{ include "rockbot.sharedPvcName" . | quote }}
  Scripts__Container__SharedVolumePath: "/rockbot/shared"
  Scripts__Container__FsGroup: {{ .Values.shared.fsGroup | quote }}

  # ── Agent data paths (all under the PVC mount at /data/agent) ─────────────
  AgentProfile__BasePath: "/data/agent"
  AgentProfile__TierRoutingLogMaxEntries: {{ .Values.agent.tierRoutingLogMaxEntries | default 1500 | quote }}
  Memory__BasePath: "/data/agent/memory"

  # ── Append-only JSONL log retention (applied once per dream cycle) ─────────
  # `dig` (not `default`) so an explicit false / 0 — which disable a dimension —
  # are honoured rather than swallowed, while a wholly-absent block (e.g. a
  # --reuse-values upgrade) still falls back to the chart defaults below.
  {{- $logRetention := .Values.agent.logRetention | default dict }}
  Dream__LogRetentionEnabled: {{ dig "enabled" true $logRetention | quote }}
  Dream__LogRetentionMaxFileAge: {{ dig "maxFileAge" "30.00:00:00" $logRetention | quote }}
  Dream__LogRetentionMaxFilesPerDirectory: {{ dig "maxFilesPerDirectory" 1000 $logRetention | quote }}
  Dream__LogRetentionMaxLinesPerFile: {{ dig "maxLinesPerFile" 10000 $logRetention | quote }}
  # ── OpenRouter app attribution (non-secret) ───────────────────────────────
  # Sent as the HTTP-Referer / X-Title headers on OpenRouter calls only, so the
  # account's activity dashboard shows this release by name instead of "unknown".
  # AppUrl is the grouping key on OpenRouter's side — changing it splits an app's
  # history in two, so override appName per release and leave appUrl alone.
  # `dig` so a --reuse-values upgrade with no llm block still gets the defaults.
  {{- $llm := .Values.llm | default dict }}
  LLM__AppName: {{ dig "appName" "rockbot" $llm | quote }}
  LLM__AppUrl: {{ dig "appUrl" "https://rockbot.dev" $llm | quote }}

  Skill__BasePath: "/data/agent/skills"
  McpBridge__ConfigPath: "/data/agent/mcp.json"
  LlmPricing__ConfigPath: "/data/agent/llm-pricing.json"

  # ── Default MCP servers (auto-seeded into mcp.json on startup) ────────────
  # The agent skips seeding an entry when an existing mcp.json entry already points
  # at the same URL (under any name) — this prevents duplicates when a server has
  # also been registered manually. Duplicate entries (same URL + credentials, any
  # name) are deduplicated at startup regardless of how they were introduced.
  {{- if (default dict .Values.introspectionMcp).enabled }}
  McpBridge__DefaultServers__introspection: "http://localhost:8081/"
  {{- end }}
  {{- if .Values.openrouterMcp.enabled }}
  McpBridge__DefaultServers__openrouter: "http://{{ include "rockbot.fullname" . }}-openrouter-mcp.{{ .Values.namespace }}.svc.cluster.local/"
  {{- end }}
  {{- if .Values.azureFoundryMcp.enabled }}
  McpBridge__DefaultServers__azure-foundry: "http://{{ include "rockbot.fullname" . }}-azure-foundry-mcp.{{ .Values.namespace }}.svc.cluster.local/"
  {{- end }}
  {{- if .Values.todoappMcp.enabled }}
  McpBridge__DefaultServers__todo: "http://mcp-todo.{{ .Values.namespace }}.svc.cluster.local/"
  {{- end }}
  ModelBehaviors__BasePath: "/data/agent/model-behaviors"

  {{- if .Values.workiq.enabled }}
  # ── Microsoft Work IQ auth (MSAL) ──────────────────────────────────────────
  # When set, the agent registers the "workiq" token provider profile so
  # mcp.json entries with auth.profile=workiq receive a bearer token on every
  # request. Cache lives at /data/agent/secrets/workiq-cache.bin.
  WorkIQ__TenantId: {{ required "workiq.tenantId is required when workiq.enabled=true" .Values.workiq.tenantId | quote }}
  WorkIQ__ClientId: {{ required "workiq.clientId is required when workiq.enabled=true" .Values.workiq.clientId | quote }}
  {{- if .Values.workiq.scopes }}
  WorkIQ__Scopes: {{ join "," .Values.workiq.scopes | quote }}
  {{- end }}
  {{- if .Values.workiq.authority }}
  WorkIQ__Authority: {{ .Values.workiq.authority | quote }}
  {{- end }}
  {{- end }}

  # ── Runtime ───────────────────────────────────────────────────────────────
  DOTNET_ENVIRONMENT: "Production"

  {{- if .Values.agent.timezone }}
  # ── Agent timezone (IANA ID) ───────────────────────────────────────────────
  Agent__Timezone: {{ .Values.agent.timezone | quote }}
  {{- end }}

  {{- if .Values.telemetry.enabled }}
  # ── OpenTelemetry ──────────────────────────────────────────────────────────
  Telemetry__Enabled: "true"
  Telemetry__OtlpEndpoint: {{ required "telemetry.otlpEndpoint is required when telemetry.enabled=true" .Values.telemetry.otlpEndpoint | quote }}
  Telemetry__ServiceName: {{ .Values.telemetry.serviceName | quote }}
  {{- end }}

  {{- with .Values.agent.extraEnv }}
  # ── Operator-supplied raw config keys (agent.extraEnv) ─────────────────────
  # Escape hatch for .NET configuration keys that have no dedicated value above.
  # Rendered last, but ConfigMap data is a map — a key repeated here would collide
  # with the templated one rather than override it, so use distinct keys only.
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
