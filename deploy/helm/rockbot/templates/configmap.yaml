apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rockbot.configmapName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
data:
  # ── RabbitMQ (non-secret) ──────────────────────────────────────────────────
  RabbitMq__HostName: {{ required "rabbitmq.hostName is required" .Values.rabbitmq.hostName | quote }}
  RabbitMq__Port: {{ .Values.rabbitmq.port | quote }}
  RabbitMq__UserName: {{ required "rabbitmq.userName is required" .Values.rabbitmq.userName | quote }}
  RabbitMq__VirtualHost: {{ .Values.rabbitmq.virtualHost | quote }}
  {{- if .Values.rabbitmq.managementApiBaseUrl }}
  RabbitMq__ManagementApiBaseUrl: {{ .Values.rabbitmq.managementApiBaseUrl | quote }}
  {{- end }}

  # ── Ephemeral script runner ────────────────────────────────────────────────
  Scripts__Container__Namespace: {{ .Values.scripts.namespace | quote }}
  Scripts__Container__Image: {{ .Values.scripts.image | quote }}
  Scripts__Container__CpuLimit: {{ .Values.scripts.cpuLimit | quote }}
  Scripts__Container__MemoryLimit: {{ .Values.scripts.memoryLimit | quote }}
  {{- if .Values.staging.enabled }}
  Scripts__Container__StagingUrl: {{ include "rockbot.stagingServiceUrl" . | quote }}
  {{- end }}

  # ── Agent data paths (all under the PVC mount at /data/agent) ─────────────
  AgentProfile__BasePath: "/data/agent"
  Memory__BasePath: "/data/agent/memory"
  Skill__BasePath: "/data/agent/skills"
  McpBridge__ConfigPath: "/data/agent/mcp.json"

  # ── Default MCP servers (auto-seeded into mcp.json on startup) ────────────
  {{- if .Values.routingStatsMcp.enabled }}
  McpBridge__DefaultServers__routing-stats: "http://localhost:8080/"
  {{- end }}
  {{- if .Values.openrouterMcp.enabled }}
  McpBridge__DefaultServers__openrouter: "http://{{ include "rockbot.fullname" . }}-openrouter-mcp.{{ .Values.namespace }}.svc.cluster.local/"
  {{- end }}
  {{- if .Values.azureFoundryMcp.enabled }}
  McpBridge__DefaultServers__azure-foundry: "http://{{ include "rockbot.fullname" . }}-azure-foundry-mcp.{{ .Values.namespace }}.svc.cluster.local/"
  {{- end }}
  {{- if .Values.staging.enabled }}
  McpBridge__DefaultServers__staging: "http://{{ include "rockbot.fullname" . }}-staging.{{ .Values.namespace }}.svc.cluster.local/"
  {{- end }}
  {{- if .Values.todoappMcp.enabled }}
  McpBridge__DefaultServers__todo: "http://mcp-todo.{{ .Values.namespace }}.svc.cluster.local/"
  {{- end }}
  ModelBehaviors__BasePath: "/data/agent/model-behaviors"

  # ── Runtime ───────────────────────────────────────────────────────────────
  DOTNET_ENVIRONMENT: "Production"

  {{- if .Values.agent.timezone }}
  # ── Agent timezone (IANA ID) ───────────────────────────────────────────────
  Agent__Timezone: {{ .Values.agent.timezone | quote }}
  {{- end }}

  {{- if .Values.telemetry.enabled }}
  # ── OpenTelemetry ──────────────────────────────────────────────────────────
  Telemetry__Enabled: "true"
  Telemetry__OtlpEndpoint: {{ required "telemetry.otlpEndpoint is required when telemetry.enabled=true" .Values.telemetry.otlpEndpoint | quote }}
  Telemetry__ServiceName: {{ .Values.telemetry.serviceName | quote }}
  {{- end }}
