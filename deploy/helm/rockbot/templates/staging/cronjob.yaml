{{- if .Values.staging.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rockbot.fullname" . }}-staging-cleanup
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: staging-cleanup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: busybox:stable
              command:
                - sh
                - -c
                - |
                  mkdir -p /rockbot/staging/tmp /rockbot/staging/drafts /rockbot/staging/exports
                  find /rockbot/staging/tmp     -mindepth 1 -mtime +{{ .Values.staging.tmpTtlDays }}     -delete
                  find /rockbot/staging/drafts  -mindepth 1 -mtime +{{ .Values.staging.draftsTtlDays }}  -delete
                  find /rockbot/staging/exports -mindepth 1 -mtime +{{ .Values.staging.exportsTtlDays }} -delete
              volumeMounts:
                - name: staging-data
                  mountPath: /rockbot/staging
          volumes:
            - name: staging-data
              persistentVolumeClaim:
                claimName: {{ include "rockbot.stagingPvcName" . }}
{{- end }}
