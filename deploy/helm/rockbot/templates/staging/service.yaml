{{- if .Values.staging.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rockbot.fullname" . }}-staging
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: staging
spec:
  type: ClusterIP
  selector:
    app: rockbot-staging
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
