{{- if and .Values.rabbitmq.managementApiBaseUrl .Values.rabbitmq.dlqRetention.enabled }}
# ── DLQ retention policy job ──────────────────────────────────────────────────
# Runs on every install/upgrade to PUT a RabbitMQ policy that caps DLQ growth:
#   - message-ttl: messages expire after dlqRetention.messageTtlMs milliseconds
#   - max-length:  oldest messages dropped when queue exceeds dlqRetention.maxLength
# Pattern \.dlq$ matches every queue declared by RockBot's RabbitMqSubscriber.
# Priority 10 lets site-specific policies (priority > 10) override if needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rockbot.fullname" . }}-dlq-policy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dlq-policy-job
        {{- include "rockbot.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: dlq-policy
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              curl -sf \
                -u "{{ .Values.rabbitmq.userName }}:${RABBITMQ_PASSWORD}" \
                -X PUT \
                -H "Content-Type: application/json" \
                -d '{
                      "pattern": "\\.dlq$",
                      "definition": {
                        "message-ttl": {{ .Values.rabbitmq.dlqRetention.messageTtlMs | int }},
                        "max-length": {{ .Values.rabbitmq.dlqRetention.maxLength | int }},
                        "overflow": "drop-head"
                      },
                      "apply-to": "queues",
                      "priority": 10
                    }' \
                "{{ .Values.rabbitmq.managementApiBaseUrl }}/api/policies/{{ .Values.rabbitmq.virtualHost | urlquery }}/dlq-retention" \
              && echo "DLQ retention policy applied." \
              || { echo "Failed to apply DLQ retention policy."; exit 1; }
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rockbot.secretName" . }}
                  key: RabbitMq__Password
{{- end }}
