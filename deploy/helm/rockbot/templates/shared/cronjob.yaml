apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rockbot.fullname" . }}-shared-cleanup
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rockbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-cleanup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          # Match fsGroup with agent + script pods so any files this cronjob
          # creates inherit the shared GID and are writable by the others.
          securityContext:
            fsGroup: {{ .Values.shared.fsGroup }}
          containers:
            - name: cleanup
              image: busybox:stable
              command:
                - sh
                - -c
                - |
                  mkdir -p /rockbot/shared/tmp /rockbot/shared/drafts /rockbot/shared/exports
                  find /rockbot/shared/tmp     -mindepth 1 -mtime +{{ .Values.shared.tmpTtlDays }}     -delete
                  find /rockbot/shared/drafts  -mindepth 1 -mtime +{{ .Values.shared.draftsTtlDays }}  -delete
                  find /rockbot/shared/exports -mindepth 1 -mtime +{{ .Values.shared.exportsTtlDays }} -delete
                  # Catch-all: any remaining file anywhere on the shared volume older than
                  # globalTtlDays. Uses -type f so directory structure is preserved.
                  # Prefixes in shared.protectedPaths are exempt — this sweep keys on
                  # mtime, so durable content that is legitimately not edited for a long
                  # time is exactly what it would delete. `!` rather than `-not`: busybox
                  # find does not reliably provide the GNU spelling.
                  find /rockbot/shared -mindepth 1 -type f -mtime +{{ .Values.shared.globalTtlDays }} \
                  {{- range .Values.shared.protectedPaths }}
                    ! -path '/rockbot/shared/{{ . }}/*' \
                  {{- end }}
                    -delete
              volumeMounts:
                - name: shared-data
                  mountPath: /rockbot/shared
          volumes:
            - name: shared-data
              persistentVolumeClaim:
                claimName: {{ include "rockbot.sharedPvcName" . }}
