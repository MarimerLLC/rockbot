# ── Image pull policy ────────────────────────────────────────────────────────
imagePullPolicy: Always

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: rockbot

# ── Agent (RockBot.Agent) ─────────────────────────────────────────────────────
agent:
  image:
    repository: rockylhotka/rockbot-agent
    tag: latest
  # Escape hatch for raw .NET configuration keys that have no dedicated value in
  # this file — e.g. AgentHost__*, Dream__*, ModelBehaviors__Models__<prefix>__*.
  # Rendered verbatim into the agent ConfigMap, so use the environment-variable
  # form with "__" as the section separator. Values are quoted for you.
  #
  #   extraEnv:
  #     AgentHost__Temperature: "0.9"
  #     Dream__MemoryConsolidationEnabled: "false"
  #     ModelBehaviors__Models__somevendor__UseTextBasedToolCalling: "true"
  #
  # Non-secret keys only — anything sensitive belongs under `secrets` instead.
  # This mirrors the optional agent.extra.env file in the docker-compose stack.
  extraEnv: {}
  # Always Recreate — only one agent may run at a time (stateful)
  replicaCount: 1
  # IANA timezone ID injected into every LLM prompt as current date/time context.
  # e.g. "America/Chicago", "Europe/London", "Asia/Tokyo"
  # Defaults to UTC (the k8s node timezone) if unset.
  timezone: "America/Chicago"
  # Retention cap for tier-routing-log.jsonl (the routing-decision telemetry log
  # consumed by the dream self-correction pass and the introspection MCP server's
  # get_routing_summary tool). Once the cap is reached the logger trims the oldest
  # entries on every append. ~500 bytes per entry, so 1500 ≈ 750 KB on disk.
  tierRoutingLogMaxEntries: 1500
  # Append-only JSONL log retention, applied once per dream cycle (see
  # docs/dream-service.md → "Log retention"). Covers skill-usage, tool-call,
  # feedback (per-session directories) and skill-resource-usage,
  # wisp-executions (single files). Values below are sized from observed live
  # traffic; raise them if you query these logs further back in time.
  logRetention:
    enabled: true
    # Per-session directory logs: delete {sessionId}.jsonl files whose last-write
    # time is older than this. Floor it at the widest dream query window (skill
    # usage looks back 30 days) so pruning never starves a pass. TimeSpan format
    # "d.hh:mm:ss". Set to "0" to disable age pruning.
    maxFileAge: "30.00:00:00"
    # Per-session directory logs: backstop cap on file count after age pruning
    # (oldest dropped first). Age pruning is the primary control; this only bites
    # during a session storm. Set to 0 to disable count pruning.
    maxFilesPerDirectory: 1000
    # Per-file line cap. Applies to the single-file logs (wisp-executions.jsonl,
    # skill-resource-usage.jsonl) AND to each per-session file — this is what bounds
    # a persistent UI/CLI session's {id}.jsonl, which age/count pruning never reaps.
    # At ~1.1 KB/line for wisp records, 10000 ≈ 11 MB, well above the 14-day window
    # the wisp dream pass reads. Set to 0 to disable line trimming.
    maxLinesPerFile: 10000
  # Read-only memory audit (see docs/memory-audit.md). Walks the memory store on its
  # own cron, keeps a long-lived trend file at /data/agent/memory-audit/, checks
  # invariants, and pushes a message to the scheduled-system session only when
  # something needs attention. Model-free apart from the weekly sample eval.
  memoryAudit:
    enabled: true
    # Measurement run. Kept well clear of the 12-hourly dream cycle so the two do not
    # queue behind each other on the agent's single work slot.
    cronSchedule: "0 4 * * *"
    # Weekly LLM-judged sample eval — four Balanced-tier JSON calls, skipped entirely
    # on weeks where the memory corpus has not changed. Set to "" to disable.
    evalCronSchedule: "0 5 * * 0"
    # Circuit breaker. When true, a run that finds entries hard-deleted outside the
    # retention purge writes a marker file that stops dream memory consolidation until
    # a human (or resume_memory_consolidation) clears it. Off by default: a false
    # positive stops the only thing keeping the corpus from growing without bound.
    pauseConsolidationOnAlert: false
  # Every other MemoryAudit__* knob (thresholds, sample size, shared-copy directory)
  # is available through agent.extraEnv — see MemoryAuditOptions for the full list.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ── Blazor UI (RockBot.UserProxy.Blazor) ─────────────────────────────────────
blazor:
  image:
    repository: rockylhotka/rockbot-blazor
    tag: latest
  # Leave at 1. The UI holds conversation state in memory (ChatStateService), so a
  # second replica would serve a different, empty conversation depending on which pod
  # the browser landed on. The data-protection volume below is ReadWriteOnce as well,
  # so raising this does not scale the UI — it deadlocks the rollout with the second
  # pod stuck Pending on a volume the first one already holds.
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Small ReadWriteOnce volume mounted read-write at /data/blazor, holding only the
  # ASP.NET Core data-protection key ring.
  #
  # The key ring is what protects antiforgery tokens (and, later, sign-in cookies).
  # Without a volume it is generated in memory and thrown away on exit, so every pod
  # restart or rollout invalidates every token the previous process issued.
  #
  # Deliberately NOT a subPath on the shared PVC, for two independent reasons:
  #   1. The shared volume is co-mounted into ephemeral script pods that run
  #      LLM-authored code. The key ring can mint valid authenticated payloads;
  #      nothing the LLM produces should be able to read it.
  #   2. The shared-cleanup CronJob's catch-all sweep deletes anything under
  #      /rockbot/shared older than shared.globalTtlDays (30). Key files are written
  #      once and never touched again, and keys live ~90 days — active keys would be
  #      reaped silently, looking exactly like a bug.
  #
  # Keys are stored as plaintext XML (no encryptor is configured on Linux); the
  # protection is that only the Blazor pod ever mounts this volume.
  storage:
    size: 128Mi

  tailscale:
    # Tailscale hostname — the UI becomes accessible at <hostname> on your tailnet.
    # Requires the Tailscale Kubernetes Operator to be installed.
    hostname: rockbot

    # Tailscale ACL tags for this endpoint's proxy device, e.g. ["tag:trees"].
    # Every entry must start with "tag:" or the chart fails to render.
    #
    # Empty (default) means the operator applies its own PROXY_TAGS value, which is
    # shared by EVERY proxy it manages in the cluster — so a tailnet ACL cannot tell
    # this deployment apart from any other service the operator exposes. Set a tag
    # when this instance needs an access rule of its own (e.g. one user who may reach
    # this UI and nothing else).
    #
    # Two things must be true before the proxy can register:
    #   1. The tag exists in the tailnet policy's tagOwners, AND
    #   2. the operator's OAuth client is listed as an owner of it, because a client
    #      may only apply tags it owns:
    #          "tagOwners": { "tag:trees": ["tag:k8s-operator"] }
    # Otherwise the proxy Pod never comes up and the endpoint simply never appears.
    #
    # NOTE: changing tags on a LIVE deployment changes the device's identity in the
    # ACL. Grant access under the new tag before you apply, or you lock yourself out
    # of the endpoint until the policy catches up.
    tags: []

    ingress:
      # false (default) — expose over a layer-3 LoadBalancer Service. Plain HTTP
      #   at http://<hostname>. No TLS certificate is issued.
      # true — expose over a layer-7 Ingress instead. The operator provisions a
      #   Let's Encrypt certificate and the UI is served at
      #   https://<hostname>.<your-tailnet>.ts.net. The Service drops to ClusterIP
      #   so only one Tailscale device ever claims <hostname>.
      #
      # Either way the endpoint stays PRIVATE to your tailnet — it resolves to a
      # CGNAT 100.x address that is not routable from the internet. Public exposure
      # would require Tailscale Funnel, which this chart never enables.
      #
      # Prerequisites (Tailscale admin console → DNS): MagicDNS enabled AND the
      # "HTTPS Certificates" toggle enabled.
      #
      # NOTE: issuing a certificate publishes <hostname>.<tailnet>.ts.net to the
      # public Certificate Transparency log, permanently. The service stays private;
      # the name does not. Do not enable this for a host whose name is sensitive.
      #
      # NOTE: switching an existing deployment from LoadBalancer to Ingress replaces
      # the Tailscale device. Apply with this false first so the old device is
      # released, then flip it to true — otherwise the new device is named
      # <hostname>-1 and the certificate is issued for that instead. Let's Encrypt
      # allows only 5 certificates per week for the same name, so a retry loop can
      # lock you out of the name for days.
      enabled: false

      # Optional ProxyGroup for HA ingress (see the tailscale.com/proxy-group
      # annotation). Empty means a single standalone proxy Pod.
      proxyGroup: ""

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
rabbitmq:
  hostName: ""      # REQUIRED — hostname or k8s service name of your RabbitMQ instance
  port: 5672
  userName: ""      # REQUIRED
  virtualHost: /
  managementApiBaseUrl: ""  # optional — e.g. http://rabbitmq-mgmt.default.svc.cluster.local:15672
                            # required for DLQ depth metrics (rockbot.messaging.dlq.depth)
                            # required for dlqRetention policy application (below)

  # DLQ retention policy — applied via RabbitMQ Management API on every helm install/upgrade.
  # Matches all *.dlq queues and enforces TTL + max-length so messages cannot accumulate forever.
  # Only active when managementApiBaseUrl is also set.
  dlqRetention:
    enabled: true
    messageTtlMs: 259200000  # 72 hours — messages older than this are expired by the broker
    maxLength: 10000          # drop oldest messages (drop-head) when queue exceeds this count

# ── Script Manager pod ────────────────────────────────────────────────────────
# Trusted sidecar that owns all pod RBAC in the scripts namespace.
# The agent has no Kubernetes API permissions; it delegates script execution
# to this pod via the RabbitMQ message bus.
manager:
  image:
    repository: rockylhotka/rockbot-scripts-manager
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ── Ephemeral script runner ───────────────────────────────────────────────────
scripts:
  image: python:3.12-slim
  cpuLimit: 500m
  memoryLimit: 256Mi

# ── Persistent storage (Longhorn) ─────────────────────────────────────────────
storage:
  storageClass: longhorn
  # Holds soul.md, directives.md, mcp.json, memory/, skills/, and other agent data
  agentDataSize: 10Gi

# ── Microsoft Work IQ (M365 MCP servers) auth ────────────────────────────────
# When enabled, the agent registers an MSAL-backed token provider for the
# "workiq" auth profile so mcp.json entries with auth.profile=workiq receive a
# bearer token on every request. Token cache is populated by the UI tier
# (Blazor/CLI) after the user completes interactive consent.
workiq:
  enabled: false
  # Entra tenant ID (GUID). Required when workiq.enabled=true.
  tenantId: ""
  # Public client application ID registered in Entra. Shared between UI and agent.
  clientId: ""
  # Delegated scopes to request at silent acquisition. Typically per-server
  # scopes like "WorkIQ-MailServer/.default", "WorkIQ-Calendar/.default", etc.
  scopes: []
  # Optional override of the OAuth authority URL (defaults to public cloud
  # tenant URL). Set for sovereign clouds.
  authority: ""

# ── Telemetry (OpenTelemetry) ─────────────────────────────────────────────────
telemetry:
  enabled: true
  # OTLP gRPC endpoint for Grafana Alloy (or otel-collector).
  # Typical Alloy service: http://alloy.<namespace>.svc.cluster.local:4317
  # Alloy routes: traces → Tempo, metrics → Mimir, logs → Loki
  otlpEndpoint: "http://alloy.loki.svc.cluster.local:4317"
  serviceName: rockbot

# ── OpenRouter MCP server ─────────────────────────────────────────────────────
# Standalone MCP server that exposes read-only OpenRouter account and usage
# information (credits, models, keys, generation logs) to the agent.
# The API key is provided via the shared secret (secrets.openRouter.apiKey).
openrouterMcp:
  enabled: false
  image:
    repository: rockylhotka/mcpserver-openrouter
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Azure AI Foundry MCP server ───────────────────────────────────────────────
# Standalone MCP server that exposes read-only Azure AI Foundry usage metrics
# (prompt tokens, generated tokens, request counts) and deployment info to the agent.
# Auth uses a service principal via DefaultAzureCredential (AZURE_TENANT_ID / CLIENT_ID / CLIENT_SECRET).
azureFoundryMcp:
  enabled: false
  image:
    repository: rockylhotka/mcpserver-azurefoundry
    tag: latest
  replicaCount: 1
  subscriptionId: ""        # Azure subscription ID (non-secret)
  resourceGroup: ""         # Resource group containing the AI Foundry account (non-secret)
  accountName: ""           # Cognitive Services account name (non-secret)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Sample Agent HTTP (RockBot.SampleAgent.Http) ─────────────────────────────
# Standalone HTTP A2A reference agent. Exposes two skills: "general" (LLM-backed)
# and "echo". Cluster DNS: rockbot-sample-agent-http.rockbot.svc.cluster.local
# Register in /data/agent/well-known-agents.json so the primary agent can invoke it.
sampleAgentHttp:
  enabled: false
  image:
    repository: rockylhotka/rockbot-sample-agent-http
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Shared volume ────────────────────────────────────────────────────────────
# ReadWriteMany PVC mounted directly into the agent, script pods, and other
# services that need shared file access. No HTTP facade — pure filesystem.
shared:
  size: 5Gi
  tmpTtlDays: 1
  draftsTtlDays: 14
  exportsTtlDays: 14
  # Catch-all sweep: after the per-directory sweeps, delete any remaining file
  # anywhere under /rockbot/shared older than this many days. Directories are
  # not touched, so empty structure is preserved. Safety net for ad-hoc paths
  # (e.g. patrol drafts, subagent artifacts) that don't have a dedicated TTL.
  globalTtlDays: 30
  # Path prefixes (relative to the volume root) exempt from the catch-all sweep.
  # The sweep keys on mtime, so a file is deleted for not having changed recently —
  # which is the normal state of durable content such as reference corpora, campaign
  # canon, or any document set the agent reads far more often than it edits. Anything
  # that must survive longer than globalTtlDays without an edit belongs here.
  # Matching is a glob on the full path, so nested content (including a `.git`
  # directory) under a listed prefix is protected too. A single file may be listed
  # as well as a directory. Leading and trailing slashes are stripped, so `canon`,
  # `/canon`, and `canon/` are equivalent. Entries are exempt from every sweep,
  # the per-directory ones above included.
  #   protectedPaths:
  #     - canon
  protectedPaths: []
  # Shared POSIX group ID applied via pod-level securityContext.fsGroup on every
  # pod that mounts the rockbot-shared PVC (agent, shared-cleanup cronjob,
  # ephemeral script pods). kubelet chgrp's the volume root to this GID, sets
  # the setgid bit on directories, and OR's group rw into the mode — so the
  # three writers (agent UID 999, cleanup UID 0, script pods UID 1000) can all
  # read/write each other's files without coordinating UIDs.
  fsGroup: 2000

# ── Introspection MCP server ──────────────────────────────────────────────────
# Sidecar container in the agent pod that exposes all agent introspection tools:
#   - get/set agent name (drives Blazor UI title and `agent-name.md` on the PVC)
#   - GitHub Copilot quota/usage (only meaningful when LLM provider is Copilot)
#   - LLM pricing table lookup (cost-estimation tools the agent calls)
#   - get_routing_summary — pre-aggregated tier-routing analysis (clusters, flagged
#     misroutes, keyword candidates, threshold scans, USD cost) over a time window
#   - get_routing_log / get_routing_stats — raw entries and global stats
# Runs alongside the agent and reads agent state from the shared PVC.
# Reachable from the agent at http://localhost:8081/.
introspectionMcp:
  enabled: true
  image:
    repository: rockylhotka/rockbot-introspection-mcp
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── TodoApp MCP server ────────────────────────────────────────────────────────
# Standalone MCP server that exposes a persistent to-do list to the agent.
# Data is stored in a Longhorn PVC mounted at /data inside the container.
todoappMcp:
  enabled: true
  image:
    repository: rockylhotka/mcpserver-todoapp
    tag: latest
  replicaCount: 1
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Secrets ───────────────────────────────────────────────────────────────────
# create: true  → Helm creates a Secret from the values below (convenient, but
#                  secret values end up in Helm release history — use for dev/test
#                  or seal with helm-secrets / external-secrets for production).
# create: false → Provide existingSecretName pointing to a pre-existing Secret.
#                  The Secret must contain all keys listed under stringData in
#                  templates/secret.yaml.
# ── OpenRouter app attribution (non-secret) ──────────────────────────────────
# OpenRouter attributes activity purely from two self-reported headers. With them
# unset, every call this agent makes lands under "unknown" on the account's
# activity dashboard. The headers are sent to OpenRouter endpoints only.
llm:
  # Display name (X-Title). Override per release so two agents sharing one
  # OpenRouter account report separately — e.g. appName: my-agent.
  appName: rockbot
  # Identity key (HTTP-Referer) and the link shown on openrouter.ai/rankings.
  # OpenRouter groups by this value, so changing it starts a new app with no
  # history. Keep it stable; distinguish releases with appName instead.
  appUrl: https://rockbot.dev

secrets:
  create: true
  existingSecretName: ""   # used only when create: false

  llm:
    # Three-tier LLM configuration. Balanced is REQUIRED.
    # Low and High are optional — both fall back to Balanced when not configured.
    # Tier selection: user messages → keyword heuristic; patrol → Balanced; dream/research → High
    #
    # Two provider types are supported, and each tier can use a different provider:
    #   - (default) OpenAI-compatible: any endpoint with endpoint + apiKey + modelId
    #   - "Copilot": GitHub Copilot SDK (per-request billing via Copilot license)
    #
    # Global provider default (applies to all tiers unless overridden per-tier):
    provider: ""            # "" = OpenAI-compatible (default), "Copilot" = GitHub Copilot SDK
    # GitHub token for Copilot provider (needs copilot scope):
    gitHubToken: ""

    # supportsImageInput declares that a tier's model accepts images alongside text.
    # It gates the analyze_file tool: with no tier set to true the tool is not registered
    # at all, and a call that needs eyes is routed to a tier that has them. A vision request
    # reaching a blind model fails with an opaque provider error, so this is declared rather
    # than guessed from the model id. See design/multimodal-input.md.
    balanced:
      provider: ""          # Per-tier override: "" inherits global, "Copilot" or "OpenAI"
      endpoint: ""          # REQUIRED for OpenAI-compatible — base URL of the API
      apiKey: ""            # REQUIRED for OpenAI-compatible — API key
      modelId: ""           # REQUIRED — model ID (e.g. anthropic/claude-haiku-4.5 or gpt-4.1)
      supportsImageInput: false   # true only if this model reads images
    # Ordered fallback chain for balanced tier. First entry is preferred; subsequent
    # entries are tried in order on failure. Takes precedence over single 'balanced'
    # when populated. Each entry has: provider, endpoint, apiKey, modelId.
    #
    # Entries take no supportsImageInput of their own — the flag is read per tier, not per
    # fallback model. So if balanced.supportsImageInput is true, every model in this chain
    # must read images: a fallback that cannot would be handed one and fail.
    balancedModels: []
    low:                    # Optional — fast/cheap model for simple factual questions
      provider: ""
      endpoint: ""
      apiKey: ""
      modelId: ""
      supportsImageInput: false
    high:                   # Optional — powerful model for dream/research/complex tasks
      provider: ""
      endpoint: ""
      apiKey: ""
      modelId: ""           # leave empty to fall back to balanced
      supportsImageInput: false

    # Legacy flat keys — kept for backward compatibility; remove after all deployments migrated
    endpoint: ""
    apiKey: ""
    modelId: ""

  # ── Embedding (optional) — hybrid BM25 + vector search ──────────────────────
  # When configured, memory, skills, and working memory use cosine similarity
  # alongside BM25 keyword search for improved recall. Falls back to BM25-only
  # when not configured — no functionality is lost.
  # Any OpenAI-compatible embedding endpoint works (OpenAI, Ollama, Azure, etc.)
  embedding:
    endpoint: ""            # e.g. "http://ollama:11434" or "https://api.openai.com/v1"
    apiKey: ""              # optional for Ollama; required for cloud providers
    model: ""               # e.g. "nomic-embed-text", "text-embedding-3-small"

  webTools:
    apiKey: ""              # REQUIRED — Brave Search API key

  rabbitmq:
    password: ""            # REQUIRED — RabbitMQ password

  openRouter:
    apiKey: ""              # required when openrouterMcp.enabled=true — OpenRouter management API key
                            # (separate from llm.apiKey — this is the account management key)

  azureFoundry:
    tenantId: ""            # required when azureFoundryMcp.enabled=true — Azure AD tenant ID
    clientId: ""            # required when azureFoundryMcp.enabled=true — service principal app ID
    clientSecret: ""        # required when azureFoundryMcp.enabled=true — service principal secret
