title: RockBot
description: An event-driven autonomous agent framework for .NET
url: https://rockbot.dev
repository: MarimerLLC/rockbot

remote_theme: just-the-docs/just-the-docs

color_scheme: dark

logo: /assets/images/rockbot.png
favicon_ico: /assets/images/favicon.ico

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3

aux_links:
  GitHub: https://github.com/MarimerLLC/rockbot
  Discord: https://discord.gg/eQjxWG6KYN

aux_links_new_tab: true

footer_content: "&copy; 2026 Marimer LLC. RockBot is released under the MIT license."

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
